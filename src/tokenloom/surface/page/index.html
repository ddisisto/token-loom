<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>token loom</title>
<link rel="stylesheet" href="assets/app.css">

<nav id="side">
  <div class="head">
    <b>token loom</b>
    <button id="fold" title="fold away" aria-pressed="false">‹</button>
  </div>
  <ol id="roots"></ol>
</nav>

<section id="read">
  <label id="aside" title="show what has been set aside">
    <input id="hidden" type="checkbox"> hidden
  </label>
  <label id="alts" title="show what else was live where the reader is pointing">
    <input id="rows" type="checkbox" checked> rows
  </label>
  <label id="whose" title="mark who put each token where it is">
    <input id="taker" type="checkbox" checked> taker
  </label>
  <label id="chart" title="draw the tree beside the text">
    <input id="charted" type="checkbox" checked> map
  </label>
</section>

<main>
  <svg id="map" aria-label="the tree under this root"></svg>
  <div id="column"></div>
  <div id="chart-bar"></div>
  <footer><div id="drawer"></div><div id="status">&nbsp;</div></footer>
</main>

<script type="module" src="assets/app.js"></script>
