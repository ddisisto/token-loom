[project]
name = "token-loom"
version = "0.1.0"
description = "A branching instrument for reading language models at the token level"
requires-python = ">=3.10"
dependencies = [
    "celery",
    "deepmerge",
    "diff-match-patch",
    "html2text",
    "jsonlines",
    "numpy",
    "openai>=1.35.5",
    "pandas",
    "pillow>=9.4.0",
    "pyperclip",
    "python-dotenv",
    "redis",
    "requests",
    "tokenizers>=0.13.2",
    "transformers>=4.26.1",
    "ttkthemes>=2.4.0",
]

# the web front end only — kept out of the main deps so the tkinter app stays unaffected
[dependency-groups]
web = [
    "fastapi",
    "uvicorn",
]

[tool.uv]
package = false
