[project]
name = "token-loom"
version = "0.1.0"
description = "A branching instrument for reading language models at the token level"
requires-python = ">=3.10"
dependencies = [
    "html2text",     # util_tree, for HTML pasted into a node
    "numpy",         # util_tree weights, util array helpers
    "openai>=1.35.5",
    "pandas",        # util.json_to_dataframe
    "python-dotenv",
    "requests",
]

# Everything the tkinter app needed and nothing else did is gone with it: celery and
# redis (the Janus task queue), transformers and tokenizers (a GPT-2 logit mask),
# ttkthemes, pillow, pyperclip, deepmerge, diff-match-patch and jsonlines.

[dependency-groups]
web = [
    "fastapi",
    "uvicorn",
]

[tool.uv]
package = false
