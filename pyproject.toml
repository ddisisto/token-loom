[project]
name = "token-loom"
version = "0.1.0"
description = "A machine output research tool: a trie over tokens, with what else was ranked at every position."
requires-python = ">=3.13"
dependencies = [
    "gguf>=0.19.0",
    "httpx>=0.28.1",
]

[project.scripts]
tokenloom = "tokenloom.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.14",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "tokenloom"
module-root = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
